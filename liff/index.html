<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V-Gate ลงทะเบียน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* LIFF page opened from the OA's rich menu: ?mode=register or ?mode=cancel. One narrow card. */
:root {
  --bg: #eef1f4; --panel: #ffffff; --ink: #17202b; --muted: #5d6a78; --line: #d5dce4;
  --accent: #e8a400; --accent-ink: #3d2b00; --ok: #1d7a4c; --warn: #b0521a;
  --font-display: "Chakra Petch", "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --panel: #19212a; --ink: #e6ebf0; --muted: #94a2b1; --line: #2c3743;
    --accent: #f2b52a; --accent-ink: #2a1d00; --ok: #4cc58a; --warn: #f08a4b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --panel: #19212a; --ink: #e6ebf0; --muted: #94a2b1; --line: #2c3743;
  --accent: #f2b52a; --accent-ink: #2a1d00; --ok: #4cc58a; --warn: #f08a4b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 40px; display: grid; gap: 16px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0; line-height: 1.2; }
.sub { margin: 4px 0 0; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; }
h2 { font-size: 16px; font-weight: 600; margin: 0; }
label { font-weight: 500; display: grid; gap: 6px; }
input[type="text"] { font: 600 22px/1.2 var(--font-display); letter-spacing: .12em; text-transform: uppercase; text-align: center;
  padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; }
input[type="text"]:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.consent { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; font-weight: 400; color: var(--muted); font-size: 14px; }
.consent input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); }
button { font: 600 16px/1 var(--font-body); padding: 14px; border-radius: 8px; border: 0; cursor: pointer; width: 100%; min-height: 48px; }
button.primary { background: var(--accent); color: var(--accent-ink); }
button.danger { background: transparent; color: var(--warn); border: 1.5px solid var(--warn); }
button.plain { background: transparent; color: var(--ink); border: 1px solid var(--line); }
button:disabled { opacity: .5; cursor: default; }
ul.students { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
ul.students li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
ul.students li .who { display: grid; }
ul.students li .id { font-size: 13px; color: var(--muted); }
ul.students li button { width: auto; min-height: 40px; padding: 8px 14px; font-size: 14px; }
.tag { font-size: 13px; white-space: nowrap; }
.tag.yes { color: var(--ok); }
.tag.no, .tag.pending, .tag.wait { color: var(--muted); }
.confirm-box { display: grid; gap: 4px; padding: 14px; border-radius: 8px; background: var(--bg); text-align: center; }
.confirm-box .big { font: 700 22px/1.3 var(--font-display); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
button.link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 4px; min-height: 0; font-weight: 400; font-size: 14px; }
.msg { margin: 0; padding: 12px; border-radius: 8px; border: 1px solid var(--line); }
.msg.ok { border-color: var(--ok); color: var(--ok); }
.msg.err { border-color: var(--warn); color: var(--warn); }
.muted { color: var(--muted); margin: 0; font-size: 14px; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1 id="title">V-Gate แจ้งเตือนผู้ปกครอง</h1>
    <p class="sub" id="subtitle">กำลังโหลด…</p>
  </header>

  <p class="msg" id="msg" role="status" hidden></p>

  <section class="card" id="current" hidden>
    <h2>นักเรียนที่รับแจ้งเตือน</h2>
    <ul class="students" id="students"></ul>
    <button class="danger" type="button" id="cancel-all" hidden>ยกเลิกทั้งหมด</button>
  </section>

  <!-- Step 1: type the student ID -->
  <form class="card" id="add" hidden>
    <h2 id="add-title">เพิ่มนักเรียน</h2>
    <label><span id="id-label">รหัสนักศึกษา</span>
      <input type="text" id="sid" maxlength="20" autocomplete="off" spellcheck="false" inputmode="numeric" required>
    </label>
    <button class="primary" type="submit" id="next">ถัดไป</button>
    <button class="link" type="button" id="use-code">มีรหัสผูกบัญชีจากวิทยาลัย (เช่น เจ้าหน้าที่ รปภ.)</button>
  </form>

  <!-- Step 2: check the name and confirm -->
  <section class="card" id="confirm" hidden>
    <h2>ใช่นักเรียนคนนี้ไหม</h2>
    <div class="confirm-box">
      <span class="big" id="c-name"></span>
      <span class="muted" id="c-id"></span>
    </div>
    <p class="muted" id="c-note" hidden></p>
    <p class="muted">เมื่อกดยืนยัน ถือว่าท่านยินยอมให้วิทยาลัยใช้ข้อมูลทะเบียนรถและเวลาเข้า-ออกวิทยาลัยของนักเรียน เพื่อส่งแจ้งเตือนมายังบัญชี LINE นี้ ยกเลิกได้ทุกเมื่อจากหน้านี้</p>
    <div class="row2">
      <button class="plain" type="button" id="back">ไม่ใช่ แก้รหัส</button>
      <button class="primary" type="button" id="ok">ใช่ ลงทะเบียน</button>
    </div>
  </section>

  <button class="plain" type="button" id="close" hidden>ปิดหน้านี้</button>
</main>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// One page for everything (the rich menu's ?mode=register and ?mode=cancel open the same screen):
// the list of children this LINE account follows, each with its own cancel / turn-on button,
// and a box to add one more child by student ID. Adding takes two taps: "ถัดไป" shows the
// student's masked name, "ใช่ ลงทะเบียน" confirms.
const ERRORS = {
  not_found: "ไม่พบรหัสนี้ในระบบ กรุณาตรวจสอบอีกครั้ง",
  bad_student: "รหัสนักศึกษาไม่ถูกต้อง กรอกเฉพาะตัวเลขหรือตัวอักษร",
  bad_code: "รหัสผูกบัญชีต้องเป็นตัวอักษรหรือตัวเลข 6 หลัก",
  locked: "ลองหลายครั้งเกินไป กรุณาลองใหม่ในอีก 1 ชั่วโมง หรือติดต่อวิทยาลัย",
  already_bound: "รหัสนี้ถูกผูกกับบัญชี LINE อื่นแล้ว กรุณาติดต่อวิทยาลัย",
  full: "นักเรียนคนนี้มีผู้รับแจ้งเตือนครบจำนวนแล้ว กรุณาติดต่อวิทยาลัย",
  not_bound: "บัญชีนี้ยังไม่ได้ลงทะเบียน",
  bad_token: "ยืนยันตัวตน LINE ไม่สำเร็จ กรุณาปิดหน้านี้แล้วเปิดใหม่จากเมนูในแชต",
  not_ready: "ระบบยังไม่พร้อมใช้งาน กรุณาลองใหม่ภายหลัง",
};
const CONSENT_LABEL = { yes: "รับแจ้งเตือนอยู่", no: "ยกเลิกแล้ว", pending: "ยังไม่ได้ยินยอม", wait: "รอวิทยาลัยอนุมัติ" };
const $ = (id) => document.getElementById(id);
let mode = "register";
let useCode = false;  // the box takes the old 6-character bind code instead of a student ID
let students = [];
let pending = null;   // what step 2 will register: { studentId } or { code }

function show(id, on) { $(id).hidden = !on; }
function message(text, kind) {
  const el = $("msg");
  el.textContent = text;
  el.className = "msg" + (kind ? " " + kind : "");
  el.hidden = !text;
}

// A fresh ID token; LINE caches one per login and it expires after about an hour.
function idToken() {
  const decoded = liff.getDecodedIDToken();
  if (!decoded || decoded.exp * 1000 < Date.now() + 60000) {
    liff.logout();
    liff.login({ redirectUri: location.href });
    return null;
  }
  return liff.getIDToken();
}

async function call(action, extra) {
  const token = idToken();
  if (!token) return { ok: false, error: "redirecting" };
  try {
    const r = await fetch("/api/liff", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, idToken: token, ...extra }),
    });
    return await r.json();
  } catch {
    return { ok: false, error: "not_ready" };
  }
}

function errorText(d) { return ERRORS[d.error] || ERRORS.not_ready; }

async function busy(btn, work) {
  btn.disabled = true;
  try { return await work(); } finally { btn.disabled = false; }
}

function render() {
  const list = $("students");
  list.replaceChildren();
  for (const s of students) {
    const li = document.createElement("li");
    const who = document.createElement("span");
    who.className = "who";
    const name = document.createElement("span");
    name.textContent = s.name;
    const id = document.createElement("span");
    id.className = "id";
    id.textContent = s.studentId === "SECURITY" ? "เจ้าหน้าที่ รปภ." : "รหัส " + s.studentId;
    const tag = document.createElement("span");
    tag.className = "tag " + s.consent;
    tag.textContent = CONSENT_LABEL[s.consent] || s.consent;
    who.append(name, id, tag);
    const btn = document.createElement("button");
    if (s.consent === "yes" || s.consent === "wait") {
      btn.className = "danger";
      btn.textContent = "ยกเลิก";
      btn.onclick = () => busy(btn, () => change("cancel", s));
    } else {
      btn.className = "plain";
      btn.textContent = "เปิดแจ้งเตือน";
      btn.onclick = () => busy(btn, () => change("resume", s));
    }
    li.append(who, btn);
    list.append(li);
  }
  const active = students.filter((s) => s.consent === "yes" || s.consent === "wait");
  show("current", students.length > 0);
  show("cancel-all", active.length > 1);
  $("title").textContent = mode === "cancel" ? "ยกเลิกการแจ้งเตือน" : "ลงทะเบียนรับแจ้งเตือน";
  $("subtitle").textContent = mode === "cancel"
    ? (active.length ? "กด \"ยกเลิก\" ที่ชื่อนักเรียนที่ไม่ต้องการรับแจ้งเตือน" : "บัญชีนี้ไม่ได้รับแจ้งเตือนอยู่")
    : "กรอกรหัสนักศึกษาของบุตรหลาน มีหลายคนก็เพิ่มได้ทีละคน";
  $("add-title").textContent = students.length ? "เพิ่มนักเรียนอีกคน" : "เพิ่มนักเรียน";
  showStep(pending ? 2 : 1);
}

function showStep(n) {
  show("add", n === 1);
  show("confirm", n === 2);
}

async function refresh() {
  const d = await call("status");
  if (d.error === "redirecting") return false;
  if (!d.ok) { $("subtitle").textContent = ""; message(errorText(d), "err"); return false; }
  students = d.students;
  render();
  return true;
}

function done(text) {
  message(text, "ok");
  show("close", liff.isInClient());
}

async function change(action, s) {
  message("");
  const d = await call(action, { studentId: s.studentId });
  if (d.error === "redirecting") return;
  if (!d.ok) return message(errorText(d), "err");
  await refresh();
  done(action === "cancel" ? `ยกเลิกการแจ้งเตือนของ ${s.name} แล้ว` : `เปิดรับแจ้งเตือนของ ${s.name} แล้ว`);
}

$("use-code").addEventListener("click", () => {
  useCode = !useCode;
  const box = $("sid");
  box.value = "";
  box.inputMode = useCode ? "text" : "numeric";
  box.maxLength = useCode ? 6 : 20;
  $("id-label").textContent = useCode ? "รหัสผูกบัญชี 6 หลัก" : "รหัสนักศึกษา";
  $("use-code").textContent = useCode ? "กรอกรหัสนักศึกษาแทน" : "มีรหัสผูกบัญชีจากวิทยาลัย (เช่น เจ้าหน้าที่ รปภ.)";
  box.focus();
});

// Step 1 -> 2
$("add").addEventListener("submit", (e) => {
  e.preventDefault();
  busy($("next"), async () => {
    message("");
    const value = $("sid").value.replace(/[\s-]/g, "");
    if (useCode) {
      const code = value.toUpperCase();
      if (!/^[A-Z0-9]{6}$/.test(code)) return message(ERRORS.bad_code, "err");
      pending = { code };
      $("c-name").textContent = code;
      $("c-id").textContent = "รหัสผูกบัญชี";
      show("c-note", false);
      return showStep(2);
    }
    if (!/^[0-9A-Za-z]{4,20}$/.test(value)) return message(ERRORS.bad_student, "err");
    const d = await call("preview", { studentId: value });
    if (d.error === "redirecting") return;
    if (!d.ok) return message(errorText(d), "err");
    if (d.already === "yes") return message(`บัญชีนี้รับแจ้งเตือนของ ${d.name} อยู่แล้ว`, "ok");
    pending = { studentId: d.studentId };
    $("c-name").textContent = d.name;
    $("c-id").textContent = "รหัส " + d.studentId;
    const note = d.others
      ? `นักเรียนคนนี้มีผู้ปกครองรับแจ้งเตือนอยู่แล้ว ${d.others} บัญชี ระบบจะแจ้งให้บัญชีเหล่านั้นทราบ` +
        (d.approval ? " และต้องรอวิทยาลัยอนุมัติก่อน" : "")
      : "";
    $("c-note").textContent = note;
    show("c-note", Boolean(note));
    showStep(2);
  });
});

$("back").addEventListener("click", () => {
  pending = null;
  message("");
  showStep(1);
  $("sid").focus();
});

// Step 2: register
$("ok").addEventListener("click", () => busy($("ok"), async () => {
  if (!pending) return showStep(1);
  message("");
  const d = await call("register", pending);
  if (d.error === "redirecting") return;
  if (!d.ok) { pending = null; showStep(1); return message(errorText(d), "err"); }
  pending = null;
  $("sid").value = "";
  await refresh();
  done(d.consent === "wait"
    ? `ส่งคำขอแล้ว รอวิทยาลัยอนุมัติ จากนั้นจะแจ้งเตือนเมื่อ ${d.name} เข้า-ออกวิทยาลัย`
    : `ลงทะเบียนสำเร็จ จะแจ้งเตือนเมื่อ ${d.name} เข้า-ออกวิทยาลัย มีบุตรหลานอีกคน กรอกรหัสเพิ่มได้เลย`);
}));

$("cancel-all").addEventListener("click", () => busy($("cancel-all"), async () => {
  if (!confirm("ยกเลิกการแจ้งเตือนของนักเรียนทุกคน?")) return;
  message("");
  const d = await call("cancel");
  if (d.error === "redirecting") return;
  if (!d.ok) return message(errorText(d), "err");
  await refresh();
  done("ยกเลิกการแจ้งเตือนทั้งหมดแล้ว");
}));

$("close").addEventListener("click", () => liff.closeWindow());

(async function start() {
  let liffId = "";
  try { liffId = (await (await fetch("/api/liff")).json()).liffId || ""; } catch { /* handled below */ }
  if (!liffId || typeof liff === "undefined") { $("subtitle").textContent = ""; return message(ERRORS.not_ready, "err"); }
  try {
    await liff.init({ liffId });
  } catch {
    $("subtitle").textContent = "";
    return message(ERRORS.not_ready, "err");
  }
  if (!liff.isLoggedIn()) return liff.login({ redirectUri: location.href });
  // Read the mode after init: LINE passes ?mode=… through liff.state and restores it here.
  mode = new URLSearchParams(location.search).get("mode") === "cancel" ? "cancel" : "register";
  await refresh();
})();
</script>
</body>
</html>
